<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#02070d" />
  <title>LIVEWORLD — Earth in motion</title>
  <link rel="stylesheet" href="/styles.css?v=3" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
      "satellite.js": "https://cdn.jsdelivr.net/npm/satellite.js@7.1.0/+esm"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="globe" aria-label="Trái Đất 3D và các vật thể đang chuyển động"></canvas>

    <header class="topbar glass">
      <a class="brand" href="/" aria-label="LIVEWORLD home">
        <span class="brand-dot"></span>
        <span>LIVEWORLD</span>
      </a>
      <form id="searchForm" class="search" role="search">
        <span class="search-icon">⌕</span>
        <input id="searchInput" autocomplete="off" placeholder="ISS, GPS BIIR-2, NORAD 25544…" aria-label="Tìm vật thể" />
        <button type="submit">Find</button>
      </form>
      <div class="clock" id="clock">--:--:-- UTC</div>
    </header>

    <aside class="layers glass" aria-label="Layers">
      <button class="layer active" id="satLayer" data-layer="satellite" title="Satellites"><span>🛰</span><b>Orbit</b></button>
      <button class="layer muted" disabled title="Aircraft data adapter is next"><span>✈</span><b>Air</b></button>
      <button class="layer muted" disabled title="Ship data adapter is next"><span>⛴</span><b>Sea</b></button>
      <button class="layer muted" disabled title="Rail data adapter is planned"><span>🚄</span><b>Rail</b></button>
      <button class="layer muted" disabled title="Launch telemetry is planned"><span>🚀</span><b>Launch</b></button>
    </aside>

    <div class="status glass" id="status" role="status" aria-live="polite">
      <span class="pulse"></span>
      <span id="statusText">Starting globe…</span>
    </div>

    <div class="hint glass" id="hint">Drag to rotate · Scroll to zoom · Click an icon</div>

    <aside class="panel glass" id="panel" aria-live="polite">
      <button class="panel-close" id="panelClose" aria-label="Đóng">×</button>
      <div class="eyebrow" id="entityType">SATELLITE</div>
      <h1 id="entityName">Select an object</h1>
      <div class="entity-id" id="entityId">Click any icon around Earth</div>
      <div class="metrics">
        <div><span>Altitude</span><strong id="mAltitude">—</strong></div>
        <div><span>Velocity</span><strong id="mVelocity">—</strong></div>
        <div><span>Latitude</span><strong id="mLat">—</strong></div>
        <div><span>Longitude</span><strong id="mLon">—</strong></div>
      </div>
      <div class="meta-row"><span>Observed / calculated</span><strong id="mTime">—</strong></div>
      <div class="meta-row"><span>Source</span><strong id="mSource">—</strong></div>
      <div class="panel-actions">
        <button id="followBtn">Follow</button>
        <button id="trackBtn" class="secondary">Show orbit</button>
      </div>
    </aside>

    <div id="fatal" class="fatal glass" hidden>
      <strong>Globe could not start</strong>
      <p id="fatalText"></p>
    </div>
  </div>

  <script type="module">
    const fatal = document.getElementById('fatal');
    const fatalText = document.getElementById('fatalText');
    import('/app.js?v=3').catch((err) => {
      console.error(err);
      fatal.hidden = false;
      fatalText.textContent = 'Không tải được module 3D. Mở DevTools → Console để xem lỗi. Thường là CDN bị chặn hoặc file /app.js không tồn tại.';
      document.getElementById('statusText').textContent = 'Startup failed';
    });
  </script>
</body>
</html>
