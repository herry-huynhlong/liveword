<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <title>ORBIT — One map for everything that moves</title>
  </head>
  <body>
    <div id="app">
      <canvas id="globe" aria-label="Bản đồ Trái Đất 3D"></canvas>

      <header class="topbar glass">
        <div class="brand">
          <span class="brand-mark">◎</span>
          <span>ORBIT</span>
        </div>
        <form id="search-form" class="search" role="search">
          <input id="search-input" autocomplete="off" placeholder="Search Earth: ISS, GPS, NORAD 25544…" aria-label="Tìm đối tượng" />
          <button type="submit">Find</button>
        </form>
        <div id="clock" class="clock"></div>
      </header>

      <aside id="entity-panel" class="panel glass hidden" aria-live="polite">
        <button id="close-panel" class="icon-btn close" type="button" aria-label="Đóng">×</button>
        <div class="entity-kicker" id="entity-type"></div>
        <h1 id="entity-name"></h1>
        <div class="status-row">
          <span id="entity-status" class="status"></span>
          <span id="entity-age" class="muted"></span>
        </div>
        <dl id="entity-stats" class="stats"></dl>
        <div class="panel-actions">
          <button id="follow-btn" type="button">Follow</button>
          <button id="orbit-btn" type="button" class="secondary">Show track</button>
        </div>
      </aside>

      <nav class="layers glass" aria-label="Layers">
        <button class="layer active" data-layer="satellite" title="Satellites">🛰</button>
        <button class="layer active" data-layer="aircraft" title="Aircraft (demo)">✈</button>
        <button class="layer active" data-layer="ship" title="Ships (demo)">🚢</button>
        <button class="layer active" data-layer="rocket" title="Rockets (demo)">🚀</button>
      </nav>

      <div class="hint glass">Drag để xoay · Scroll để zoom · Click icon để xem dữ liệu</div>
      <div id="toast" class="toast"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
